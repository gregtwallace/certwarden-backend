name: run build script

on:
  workflow_dispatch:
  push:

env:
  GITHUB_REF: ${{ github.ref }}

permissions:
  contents: read

jobs:
  run-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.14"]
        build-target:
          - "windows_amd64"
          - "linux_amd64"
          - "linux_arm64"
          - "darwin_amd64"
          - "darwin_arm64"
          - "freebsd_amd64"
          - "freebsd_arm64"

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.GITHUB_REF }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build using build script
        run: python build.py ${{ matrix.build-target }} --gitrequired
